<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>JODConverter Sample - Spring Boot Starter</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>

    <link href="/lib/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>

</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="https://github.com/jodconverter/jodconverter">JODConverter</a>
    </div>
</nav>

<div class="container my-5">

    <div class="text-center mb-4">
        <a href="https://github.com/jodconverter/jodconverter">
            <img alt="JODConverter" src="/img/jodconverter_w250.png"/>
        </a>
    </div>

    <h3>Sample
        <small class="h5 text-body-secondary">Spring Boot Starter</small>
    </h3>

    <hr class="mb-4"/>

    <!-- Where the script of the page shows the message of the server when a conversion fails. -->
    <div id="errorMessage"></div>

    <div class="card">
        <h4 class="card-header">Convert Documents</h4>
        <div class="card-body">

            <!-- The script of the page sends the form and saves the answer (js/converter.js). -->
            <form id="converterForm" action="/converter" enctype="multipart/form-data" method="post">

                <div class="mb-3">
                    <label for="inputFile" class="form-label">Document</label>
                    <input id="inputFile" name="inputFile" class="form-control" type="file" onchange="onInputFileChange()">
                </div>

                <div class="mb-3">
                    <label for="outputFormat" class="form-label">Convert as type</label>
                    <select id="outputFormat" name="outputFormat" class="form-select" disabled onchange="onOutputFormatChange()">
                        <option>Choose type</option>
                    </select>
                </div>

                <details class="mb-3">
                    <summary class="mb-3">Options</summary>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password of the document</label>
                        <input id="password" name="password" class="form-control" type="password" autocomplete="off">
                        <div class="form-text">Only for a document that is protected by a password.</div>
                    </div>

                    <div class="form-check mb-2">
                        <input id="landscape" name="landscape" class="form-check-input" type="checkbox" value="true">
                        <label for="landscape" class="form-check-label">Landscape pages</label>
                        <div class="form-text">Text documents and spreadsheets.</div>
                    </div>

                    <div class="form-check mb-3">
                        <input id="removeHeaderFooter" name="removeHeaderFooter" class="form-check-input" type="checkbox" value="true">
                        <label for="removeHeaderFooter" class="form-check-label">Remove the page header and footer</label>
                        <div class="form-text">For a CSV file, the name of the sheet at the top of each page and "Page 1" at the bottom.</div>
                    </div>

                    <!-- Enabled by converter.js when the output is a PDF document. -->
                    <fieldset id="pdfOptions" disabled>
                        <legend class="h6">PDF options</legend>

                        <div class="mb-3">
                            <label for="pdfPreset" class="form-label">Kind of PDF</label>
                            <select id="pdfPreset" name="pdfPreset" class="form-select">
                                <option value="">As the office is configured</option>
                                <option value="archive">Archive (PDF/A-2b)</option>
                                <option value="accessible">Accessible (PDF/UA)</option>
                                <option value="compact">Compact (compressed images)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="pageRange" class="form-label">Pages</label>
                            <input id="pageRange" name="pageRange" class="form-control" type="text" placeholder="All, or for example 1-3;7">
                        </div>
                    </fieldset>
                </details>

                <button id="formGo" type="submit" class="btn btn-primary" disabled>Convert!</button>

            </form>
        </div>

    </div>

</div>

<script type="text/javascript" src="/lib/bootstrap/js/bootstrap.min.js"></script>
<script type="text/javascript" src="/js/documentFormats.js"></script>
<script type="text/javascript" src="/js/converter.js"></script>

</body>
</html>
