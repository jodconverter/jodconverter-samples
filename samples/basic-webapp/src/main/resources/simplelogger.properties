# The logging of the web application: SLF4J with its simple logger, which writes to the console.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.showShortLogName=true

# Uncomment to see what JODConverter does with the office processes.
#org.slf4j.simpleLogger.log.org.jodconverter=debug
