server:
  port: 8085

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  application:
    name: JODConverter Sample Rest Api

springdoc:
  show-actuator: false
  api-docs:
    path: /rest/api
    groups:
      enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

jodconverter:
  local:
    enabled: true
    port-numbers: 2002,2003
  # Since JODConverter 5.0, the options of the document formats are set once, for every converter
  # (they were under jodconverter.local.format-options).
  document-formats:
    options:
      html:
        store:
          TEXT:
            FilterOptions: EmbedImages

      xhtml:
        store:
          TEXT:
            FilterOptions: EmbedImages

# The actuator shows the state of the office processes: /actuator/health has a "jodconverter"
# component, and /actuator/metrics lists the jodconverter.* meters (queue size, workers by state,
# restarts, task retries). Only these two endpoints are exposed, and the details of the health
# are shown to everyone, which suits a sample: restrict both in a real application.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.jodconverter: debug
