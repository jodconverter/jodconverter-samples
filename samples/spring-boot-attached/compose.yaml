# The office of the sample: LibreOffice in a container, listening for UNO connections; and, with
# the "app" profile, the application in a container of its own, on the same network.
#
#   docker compose up --build -d                  the office alone, on port 2012 of this machine,
#                                                 for the application run with gradlew bootRun
#   docker compose --profile app up --build -d    the office and the application, which connects
#                                                 to the office by its name, "office"; build the
#                                                 jar of the application first (gradlew bootJar)
#   docker compose --profile app down             stops them
services:
  office:
    build: ./office
    image: jodconverter-sample-office
    ports:
      # For the application run on this machine (gradlew bootRun). Published on this machine
      # only, and on 2012 rather than 2002: the other samples and the tests of JODConverter start
      # offices of their own on 2002 and 2003. Whoever can connect to this port controls the
      # office; the application of the "app" profile does not need it.
      - "127.0.0.1:2012:2002"
    # JODConverter does not restart an office it did not start: the container is restarted when
    # the office exits, and the application reconnects.
    restart: unless-stopped
    mem_limit: 1g

  app:
    profiles: ["app"]
    # The jar built by gradlew :samples:spring-boot-attached:bootJar, run by a Java runtime: the
    # application has no LibreOffice, only the office libraries in its jar.
    image: eclipse-temurin:17-jre-noble
    command: ["java", "-jar", "/app/spring-boot-attached.jar"]
    volumes:
      - ./build/libs:/app:ro
    environment:
      # The office is another host: the container "office" of this network, on the port it listens
      # on in its container. Nothing of the office is published for this.
      OFFICE_HOST: office
      OFFICE_PORT: "2002"
    ports:
      # APP_PORT=8081 for another port, when 8080 is taken on this machine.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      - office
    restart: unless-stopped
