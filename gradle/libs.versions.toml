# The versions of everything the samples use, in one place. Dependabot reads this file and
# proposes the updates (see .github/dependabot.yml).

[versions]

# The Java version the samples are compiled for. JODConverter 5 needs Java 17 or later.
java = "17"

# Latest version -> https://central.sonatype.com/artifact/org.jodconverter/jodconverter-core
jodconverter = "5.1.0"

# The Spring Boot line that the starter of JODConverter is built for.
# Latest version -> https://central.sonatype.com/artifact/org.springframework.boot/spring-boot
spring-boot = "4.1.1"

# Latest version -> https://central.sonatype.com/artifact/commons-io/commons-io
commons-io = "2.22.0"

# The line of springdoc for Spring Boot 4.
# Latest version -> https://central.sonatype.com/artifact/org.springdoc/springdoc-openapi-starter-webmvc-ui
springdoc = "3.1.1"

# Latest version -> https://central.sonatype.com/artifact/io.swagger.core.v3/swagger-annotations
swagger = "2.2.55"

# Latest version -> https://central.sonatype.com/artifact/org.slf4j/slf4j-api
slf4j = "2.0.20"

# --- The basic web application -------------------------------------------------------------------

# The embedded server that runs the web application (the run task and the test). Tomcat 11
# implements Jakarta Servlet 6.1.
# Latest version -> https://central.sonatype.com/artifact/org.apache.tomcat.embed/tomcat-embed-core
tomcat = "11.0.27"

# The API the web application is written for; the servlet container provides it.
# Latest version -> https://central.sonatype.com/artifact/jakarta.servlet/jakarta.servlet-api
jakarta-servlet = "6.1.0"

# The tests of the basic web application; the Spring Boot samples take JUnit from the BOM of
# Spring Boot.
# Latest version -> https://central.sonatype.com/artifact/org.junit/junit-bom
junit = "6.1.3"

[libraries]

jodconverter-local-lo = { module = "org.jodconverter:jodconverter-local-lo", version.ref = "jodconverter" }
jodconverter-remote = { module = "org.jodconverter:jodconverter-remote", version.ref = "jodconverter" }
jodconverter-spring-boot-starter = { module = "org.jodconverter:jodconverter-spring-boot-starter", version.ref = "jodconverter" }

# The BOM of Spring Boot gives their versions to the libraries below that have none: each build
# file imports it with platform(libs.spring.boot.dependencies).
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations", version.ref = "swagger" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }

# The BOM of JUnit, for the basic web application, which has no BOM of Spring Boot.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

[plugins]

spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
