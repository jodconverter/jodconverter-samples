name: tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# A new push to the same pull request or branch cancels the run in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only: the job only reads the repository.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # The actions are pinned to the commit of a version; Dependabot updates the commit and the
      # version in the comment together (.github/dependabot.yml).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the Gradle wrapper
        # gradle/wrapper/gradle-wrapper.jar is a binary that runs at every build: its checksum
        # must be one that Gradle published.
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install LibreOffice
        # The tests of the two Spring Boot samples convert documents through a real office.
        timeout-minutes: 10
        run: |
          sudo apt-get -q update
          sudo apt-get -y -q install libreoffice
          soffice --version

      - name: Build and test the samples
        # --continue: a failing sample does not hide the results of the others.
        run: ./gradlew build --continue

      # The reports are written to the summary of the run (the default of this version of the
      # reporter), which needs no permission. They are written even when a test failed, which is
      # when they are needed, and a report that cannot be made does not fail the job.
      - name: Report (REST)
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        continue-on-error: true
        with:
          name: Tests Results REST
          path: "samples/spring-boot-rest/**/test-results/**/TEST*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Report (WEBAPP)
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        continue-on-error: true
        with:
          name: Tests Results WEBAPP
          path: "samples/spring-boot-webapp/**/test-results/**/TEST*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Report (REMOTE)
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        continue-on-error: true
        with:
          name: Tests Results REMOTE
          path: "samples/spring-boot-remote/**/test-results/**/TEST*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Report (ATTACHED)
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        continue-on-error: true
        with:
          name: Tests Results ATTACHED
          path: "samples/spring-boot-attached/**/test-results/**/TEST*.xml"
          reporter: java-junit
          fail-on-error: false
