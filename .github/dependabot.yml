# Opens pull requests to update the dependencies of the samples and the actions of the workflow.
# Docs: https://docs.github.com/en/code-security/dependabot
version: 2

updates:
  # The versions are in gradle/libs.versions.toml.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # A major version of JODConverter or of Spring Boot needs changes in the samples, and the two
      # go together (the starter of JODConverter is built for one line of Spring Boot): they are
      # upgraded deliberately, not proposed.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      gradle-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The base image of the office of the attached sample (office/Dockerfile).
  - package-ecosystem: "docker"
    directory: "/samples/spring-boot-attached/office"
    schedule:
      interval: "weekly"

  # The conversion server of the remote sample (compose.yaml).
  - package-ecosystem: "docker-compose"
    directory: "/samples/spring-boot-remote"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
